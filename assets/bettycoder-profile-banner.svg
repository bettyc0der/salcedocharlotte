<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
  <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#F2E4C3"/>
    <circle cx="3" cy="5" r="0.7" fill="#C8B98F" opacity=".28"/>
    <circle cx="12" cy="11" r="0.6" fill="#8D7B55" opacity=".18"/>
  </pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#283225" opacity=".16"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="5" dy="7" stdDeviation="2.5" flood-color="#211912" flood-opacity=".35"/>
  </filter>
  <linearGradient id="panel" x1="0" x2="1">
    <stop offset="0" stop-color="#394B39"/>
    <stop offset=".55" stop-color="#52664E"/>
    <stop offset="1" stop-color="#354335"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" x2="1">
    <stop offset="0" stop-color="#6E2E1B"/>
    <stop offset=".45" stop-color="#A94E2E"/>
    <stop offset="1" stop-color="#5A2418"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" x2="1">
    <stop offset="0" stop-color="#F5C58E"/>
    <stop offset=".55" stop-color="#FFD8A5"/>
    <stop offset="1" stop-color="#EFAE79"/>
  </linearGradient>
</defs>

<!-- parchment field -->
<rect width="1600" height="500" fill="url(#paper)"/>
<rect x="10" y="10" width="1580" height="480" rx="30" fill="none" stroke="#2A2118" stroke-width="7"/>
<rect x="28" y="28" width="1544" height="444" rx="24" fill="none" stroke="#8D7445" stroke-width="2"/>

<!-- vintage top instrument deck -->
<rect x="36" y="38" width="1528" height="86" rx="16" fill="#827F68" stroke="#2A2118" stroke-width="5"/>
<rect x="55" y="54" width="225" height="53" rx="8" fill="#6F715E" stroke="#2A2118" stroke-width="3"/>
<circle cx="82" cy="80" r="9" fill="#BF542B" stroke="#2A2118" stroke-width="3"/>
<circle cx="112" cy="80" r="9" fill="#D9B85E" stroke="#2A2118" stroke-width="3"/>
<circle cx="142" cy="80" r="9" fill="#4F654C" stroke="#2A2118" stroke-width="3"/>
<rect x="174" y="62" width="80" height="37" rx="5" fill="#E9C97F" stroke="#2A2118" stroke-width="3"/>
<path d="M185 85q28-25 56 0" fill="none" stroke="#9B4B2B" stroke-width="4"/>
<line x1="213" y1="84" x2="232" y2="69" stroke="#2A2118" stroke-width="3"/>

<!-- center title display -->
<rect x="335" y="52" width="930" height="58" rx="10" fill="#2C322A" stroke="#1F1812" stroke-width="4"/>
<text x="800" y="79" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4E4BE" letter-spacing="2">SECURE TODAY • PROTECT TOMORROW</text>
<text x="800" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#D8AE51" letter-spacing="3">BETTYCODER SYSTEMS LAB • EST. 2026</text>

<!-- right gauges -->
<g transform="translate(1310,55)">
  <circle cx="45" cy="28" r="24" fill="#E8C974" stroke="#2A2118" stroke-width="4"/>
  <path d="M28 38q17-30 34 0" fill="none" stroke="#B54E27" stroke-width="5"/>
  <line x1="45" y1="29" x2="58" y2="17" stroke="#2A2118" stroke-width="3"/>
  <circle cx="116" cy="28" r="20" fill="#D9B85E" stroke="#2A2118" stroke-width="4"/>
  <line x1="116" y1="28" x2="128" y2="18" stroke="#2A2118" stroke-width="3"/>
  <g transform="translate(155,3)">
    <rect x="0" y="0" width="20" height="50" rx="5" fill="#B75A31" stroke="#2A2118" stroke-width="3"/>
    <rect x="27" y="0" width="20" height="50" rx="5" fill="#8E4429" stroke="#2A2118" stroke-width="3"/>
    <rect x="54" y="0" width="20" height="50" rx="5" fill="#C5783C" stroke="#2A2118" stroke-width="3"/>
  </g>
</g>

<!-- main green lab panel -->
<rect x="55" y="143" width="1490" height="300" rx="25" fill="url(#panel)" stroke="#2A2118" stroke-width="6"/>
<rect x="55" y="143" width="1490" height="300" rx="25" fill="url(#dots)" opacity=".75"/>

<!-- left technical doodles -->
<g stroke="#E9DEBE" fill="none" stroke-width="3" opacity=".8">
  <path d="M105 190h125m-60-35v70m-35-55l70 70m0-70l-70 70"/>
  <path d="M95 360c65-80 120-70 175-5"/>
  <path d="M83 393h198"/>
  <circle cx="165" cy="325" r="42"/>
  <path d="M165 283v84M123 325h84"/>
</g>
<g fill="#D8AE51" opacity=".9">
  <path d="M96 260l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
  <path d="M285 201l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
</g>

<!-- main cream sign -->
<g filter="url(#shadow)">
<path d="M305 170 Q345 142 400 150 H1040 Q1095 142 1135 170 L1170 208 V372 L1135 410 Q1095 438 1040 430 H400 Q345 438 305 410 L270 372 V208 Z"
      fill="#F3E4C1" stroke="#2A2118" stroke-width="6"/>
</g>
<path d="M318 188H1118" stroke="#AF8B4A" stroke-width="2"/>
<path d="M318 394H1118" stroke="#AF8B4A" stroke-width="2"/>

<!-- shield logo -->
<g transform="translate(335,218)">
  <path d="M0 0h120l25 20v95l-85 65-85-65V20z" fill="#476047" stroke="#2A2118" stroke-width="6"/>
  <path d="M17 21h86l18 13v68l-61 47-61-47V34z" fill="#5B7358"/>
  <rect x="43" y="52" width="34" height="56" rx="17" fill="#F1E1BC"/>
  <circle cx="60" cy="68" r="10" fill="#476047"/>
  <path d="M60 78v18" stroke="#476047" stroke-width="7"/>
  <g stroke="#F1E1BC" stroke-width="6" stroke-linecap="round">
    <path d="M31 70H7M89 70h24M35 49L19 33M85 49l16-16M35 91l-16 16M85 91l16 16"/>
  </g>
</g>

<!-- BettyCoder type -->
<text x="740" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" font-style="italic" fill="#2A2118">BettyCoder</text>
<rect x="510" y="284" width="470" height="48" rx="8" fill="#496049"/>
<text x="745" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#F4E5C2">CODE SMART • STAY SECURE</text>

<!-- social / identity line -->
<g font-family="Arial, sans-serif" fill="#2A2118">
  <circle cx="570" cy="366" r="22" fill="#5B7358"/>
  <text x="570" y="374" text-anchor="middle" font-size="25" fill="#F3E4C1">⌘</text>
  <text x="610" y="361" font-size="20" font-weight="700">GitHub</text>
  <text x="610" y="384" font-size="18" fill="#496049">@bettyc0der</text>

  <circle cx="810" cy="366" r="22" fill="#D2AA52"/>
  <text x="810" y="374" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2118">HTB</text>
  <text x="850" y="361" font-size="20" font-weight="700">Hack The Box</text>
  <text x="850" y="384" font-size="18" fill="#496049">BettyCoder</text>
</g>

<!-- BettyCoder character, auburn hair -->
<g transform="translate(1180,147)" filter="url(#shadow)">
  <!-- hair back -->
  <path d="M167 51c58-35 137 7 143 72 51 4 69 65 32 99 19 55-18 103-71 97-27 39-85 38-115 0-44 11-83-17-85-58-42-16-47-72-13-99-13-46 27-98 79-91 6-10 16-16 30-20z"
        fill="url(#hair)" stroke="#2A2118" stroke-width="6"/>
  <!-- neck -->
  <path d="M162 223h62v58h-62z" fill="url(#skin)" stroke="#2A2118" stroke-width="5"/>
  <!-- face -->
  <path d="M113 101c9-51 73-79 119-52 39 23 47 83 24 132-21 44-59 70-95 61-38-10-61-63-48-141z"
        fill="url(#skin)" stroke="#2A2118" stroke-width="5"/>
  <!-- hair front rolls -->
  <path d="M108 101c8-45 38-77 81-77 33 0 61 16 80 45-28-14-58-14-80 3-25 19-39 46-81 29z"
        fill="url(#hair)" stroke="#2A2118" stroke-width="5"/>
  <path d="M128 80c-4-30 28-54 56-44 28 11 27 47 8 58-18 10-46 7-64-14z" fill="#B85A35" stroke="#2A2118" stroke-width="4"/>
  <path d="M178 34c26-16 58-5 67 22-16-10-31-11-45-2-13 9-17 20-22 34-13-20-13-41 0-54z"
        fill="#7B341F" stroke="#2A2118" stroke-width="4"/>
  <!-- eye + brow -->
  <path d="M141 136q18-13 35 0" stroke="#2A2118" stroke-width="4" fill="none"/>
  <path d="M205 136q16-10 29 1" stroke="#2A2118" stroke-width="4" fill="none"/>
  <path d="M143 129q16-16 37-7" stroke="#2A2118" stroke-width="4" fill="none"/>
  <path d="M203 123q18-9 32 5" stroke="#2A2118" stroke-width="4" fill="none"/>
  <ellipse cx="158" cy="137" rx="5" ry="7" fill="#52664E"/>
  <path d="M209 137q10 7 20 0" stroke="#2A2118" stroke-width="3" fill="none"/>
  <!-- nose / lips -->
  <path d="M190 141q-4 19 6 27" stroke="#9C5A38" stroke-width="3" fill="none"/>
  <path d="M166 184q28-18 52 0-23 31-52 0z" fill="#B63F2B" stroke="#2A2118" stroke-width="3"/>
  <path d="M170 184q22 8 44 0" stroke="#F4E4C1" stroke-width="3"/>
  <!-- dress -->
  <path d="M93 286c29-33 65-45 98-42 41 3 76 17 101 49l29 122H60z"
        fill="#4F684F" stroke="#2A2118" stroke-width="6"/>
  <path d="M147 247l39 46 42-48 22 18-64 73-62-72z" fill="#F1E1BC" stroke="#2A2118" stroke-width="4"/>
  <!-- polka dots -->
  <g fill="#F1E1BC">
    <circle cx="111" cy="307" r="7"/><circle cx="151" cy="338" r="7"/><circle cx="215" cy="317" r="7"/>
    <circle cx="266" cy="349" r="7"/><circle cx="99" cy="376" r="7"/><circle cx="190" cy="392" r="7"/>
    <circle cx="247" cy="401" r="7"/>
  </g>
  <!-- apron -->
  <path d="M131 342h111l14 73H114z" fill="#F4E6C7" stroke="#2A2118" stroke-width="5"/>
  <path d="M124 344q63 18 124 0" fill="none" stroke="#D6C09A" stroke-width="4"/>
  <!-- arm / screwdriver -->
  <path d="M272 287q36 27 43 70" stroke="url(#skin)" stroke-width="28" stroke-linecap="round"/>
  <path d="M310 349l33-78" stroke="#2A2118" stroke-width="10" stroke-linecap="round"/>
  <path d="M341 273l26-60" stroke="#F1E1BC" stroke-width="7" stroke-linecap="round"/>
  <path d="M302 356q17-10 29 4" stroke="#2A2118" stroke-width="4" fill="none"/>
  <!-- pearl earring -->
  <circle cx="248" cy="157" r="10" fill="#D5CDAF" stroke="#2A2118" stroke-width="4"/>
</g>

<!-- little lab notes -->
<g font-family="Courier New, monospace" font-size="16" fill="#E9DEBE" opacity=".86">
  <text x="85" y="172">&lt;html&gt;</text>
  <text x="92" y="420">secure { display: lock; }</text>
  <text x="1390" y="425">nmap -sV -O</text>
</g>

<!-- decorative stars -->
<g fill="#F0D58D">
  <path d="M1210 185l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
  <path d="M1500 340l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
</g>

</svg>